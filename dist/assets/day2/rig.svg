<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="16" fill="#f0ede6"/><g font-family="Arial,sans-serif" fill="#20252a"><text x="50" y="65" font-size="28" font-weight="bold">Armature · four user controls</text><text x="55" y="145" font-size="22">Master</text><text x="400" y="145" font-size="20" fill="#62686d">Position</text><text x="55" y="220" font-size="22">Rotation_Bone</text><text x="400" y="220" font-size="20" fill="#62686d">Rotation</text><text x="55" y="295" font-size="22">Stretch_Top_Bone</text><text x="400" y="295" font-size="20" fill="#62686d">Squeeze from the top</text><text x="55" y="370" font-size="22">Stretch_Bottom_Bone</text><text x="400" y="370" font-size="20" fill="#62686d">Squeeze from the bottom</text><text x="55" y="445" font-size="22">Stretch_Middle_Bone</text><text x="400" y="445" font-size="20" fill="#62686d">Automatic — driven by top / bottom</text><text x="50" y="565" font-size="15" fill="#62686d">Stretch_Middle_Bone responds automatically. Do not animate it directly.</text></g></svg>